name: Release

# This workflow cuts a new release:
#   1. Finds the previous vMAJOR.MINOR.PATCH tag and computes the next version
#      (patch -> {major}.{minor}.{patch+1}, minor -> {major}.{minor+1}.0).
#   2. Updates VERSION and the "Latest released version" line in README.md.
#   3. Commits ("[v<version>] <title>") and pushes the change to main using the deploy key.
#   4. Tags that commit as v<version> and pushes the tag (tags are never moved).
#   5. Creates the GitHub release with the given title and notes since the previous tag.
#   6. Generates the doxygen docs and force-pushes them to the `docs` branch.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
      release_title:
        description: 'The title of the release'
        required: true
        type: string
      dry_run:
        description: 'Dry run: compute the version and commit locally, but do not push, tag, or release'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write   # Required for OIDC authentication with AWS
  contents: write   # Required to checkout and create the release

env:
  AWS_REGION: us-east-1
  GH_TOKEN: ${{github.token}}
  VERSION_FILE: VERSION
  DEPLOY_KEY_SECRET_ID: github-deploy-key/${{ github.repository }}
  CI_IOT_CONTAINERS: arn:aws:iam::123124136734:role/CRT_IoT_Containers

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_IOT_CONTAINERS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve deploy key and setup SSH
        run: |
          # Retrieve the private key from Secrets Manager
          DEPLOY_KEY=$(aws secretsmanager get-secret-value --secret-id "$DEPLOY_KEY_SECRET_ID" --query SecretString --output text | jq -r '.private_key')
          # Set up SSH configuration
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add GitHub to known hosts to avoid host verification prompt
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          # Configure SSH to use the key for GitHub
          cat > ~/.ssh/config << EOF
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/deploy_key
          EOF
          chmod 600 ~/.ssh/config

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive # docs are generated from crt/aws-crt-cpp headers too
          persist-credentials: false

      - name: Configure git to use SSH with deploy key
        run: |
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git config --local user.email "aws-sdk-common-runtime@amazon.com"
          git config --local user.name "aws-crt-bot"

      - name: Compute next version from previous tag
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          # Highest vMAJOR.MINOR.PATCH tag; skips beta/rc tags.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo " No previous vMAJOR.MINOR.PATCH tag found"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${PREV_TAG#v}"
          case "$RELEASE_TYPE" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "Previous tag: $PREV_TAG -> new version: $VERSION"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update VERSION and README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > "$VERSION_FILE"
          sed -i -r "s/.*Latest released version:.*/Latest released version: v${VERSION}/" README.md
          grep -q "Latest released version: v${VERSION}" README.md

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          git add "$VERSION_FILE" README.md
          git commit -m "[v$VERSION] $RELEASE_TITLE"

      - name: Push to main
        if: ${{ !inputs.dry_run }}
        run: git push origin main

      - name: Tag the version commit
        if: ${{ !inputs.dry_run }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          # Major version 0 is a pre-release.
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == v0.* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            --notes-start-tag "$PREV_TAG" \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Install doxygen
        run: |
          echo "Compiling and installing doxygen 1.17.0 from source"
          sudo apt-get update
          sudo apt-get install -y flex bison
          git clone --depth 1 https://github.com/doxygen/doxygen.git -b Release_1_17_0 /tmp/doxygen
          cmake -S /tmp/doxygen -B /tmp/doxygen/build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/doxygen/build -j 4
          sudo cmake --install /tmp/doxygen/build
          doxygen --version

      - name: Generate documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Updating documentation version to ${VERSION}"
          sed -i -r -e "s/^PROJECT_NUMBER( *)= .*/PROJECT_NUMBER\1= ${VERSION}/" docsrc/doxygen.config
          ./make-docs.py

      - name: Commit documentation
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git add --force docs/
          git commit --message="Update Docs: ${TAG_NAME}"

      - name: Push generated documentation to docs branch
        if: ${{ !inputs.dry_run }}
        # Force push so that `docs` branch always looks like `main`,
        # but with 1 additional "update docs" commit.
        run: git push --force origin HEAD:refs/heads/docs

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          git show --stat HEAD
          echo "Dry run: skipped push to main, tag $TAG_NAME, and release '$RELEASE_TITLE' (notes since $PREV_TAG)"
